services:
  docs:
    image: confirming_django_tenants_local_docs
    container_name: confirming_django_tenants_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./confirming_django_tenants:/app/confirming_django_tenants:z
    ports:
      - '9000:9000'
    command: /start-docs
